syntax = "proto3";

package music;

// ---- Entidades -------------------------------------------------------
message User     { int32 id = 1; string name = 2; int32 age = 3; }
message Song     { int32 id = 1; string name = 2; string artist = 3; }
message Playlist { int32 id = 1; string name = 2; int32 user_id = 3; repeated int32 song_ids = 4; }

// ---- Mensagens auxiliares ---------------------------------------------
message Empty {}
message IdRequest { int32 id = 1; }

message UserList     { repeated User users = 1; }
message SongList     { repeated Song songs = 1; }
message PlaylistList { repeated Playlist playlists = 1; }

message CreateUserRequest { string name = 1; int32 age = 2; }
message UpdateUserRequest { int32 id = 1; string name = 2; int32 age = 3; }

message CreateSongRequest { string name = 1; string artist = 2; }
message UpdateSongRequest { int32 id = 1; string name = 2; string artist = 3; }

message CreatePlaylistRequest { int32 user_id = 1; string name = 2; repeated int32 song_ids = 3; }
message UpdatePlaylistRequest { int32 id = 1; string name = 2; }
message PlaylistSongRequest   { int32 playlist_id = 1; int32 song_id = 2; }

// ---- Serviços ---------------------------------------------------------
service UserService {
  rpc ListUsers (Empty) returns (UserList);
  rpc GetUser (IdRequest) returns (User);
  rpc CreateUser (CreateUserRequest) returns (User);
  rpc UpdateUser (UpdateUserRequest) returns (User);
  rpc DeleteUser (IdRequest) returns (Empty);
  rpc ListUserPlaylists (IdRequest) returns (PlaylistList);
}

service SongService {
  rpc ListSongs (Empty) returns (SongList);
  rpc GetSong (IdRequest) returns (Song);
  rpc CreateSong (CreateSongRequest) returns (Song);
  rpc UpdateSong (UpdateSongRequest) returns (Song);
  rpc DeleteSong (IdRequest) returns (Empty);
  rpc ListSongPlaylists (IdRequest) returns (PlaylistList);
}

service PlaylistService {
  rpc ListPlaylists (Empty) returns (PlaylistList);
  rpc GetPlaylist (IdRequest) returns (Playlist);
  rpc CreatePlaylist (CreatePlaylistRequest) returns (Playlist);
  rpc UpdatePlaylist (UpdatePlaylistRequest) returns (Playlist);
  rpc DeletePlaylist (IdRequest) returns (Empty);
  rpc ListPlaylistSongs (IdRequest) returns (SongList);
  rpc AddSong (PlaylistSongRequest) returns (Playlist);
  rpc RemoveSong (PlaylistSongRequest) returns (Playlist);
}
